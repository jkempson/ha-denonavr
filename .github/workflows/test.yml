name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt ruff==0.14.0
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components/denonavr/entity.py custom_components/denonavr/number.py custom_components/denonavr/select.py custom_components/denonavr/switch.py tests/test_settings.py tests/test_volume.py tests/conftest.py custom_components/denonavr/volume.py
      - run: pytest -q
